<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Something You Might Need Today</title>

  <style>

    * {

      box-sizing: border-box;

    }

    body {

      margin: 0;

      min-height: 100vh;

      font-family: Arial, sans-serif;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 24px;

      transition: background 0.6s ease;

      color: #2f3431;

    }

    .page {

      width: 100%;

      max-width: 560px;

    }

    .card {

      background: rgba(255, 255, 255, 0.92);

      border-radius: 28px;

      padding: 42px 28px 30px;

      text-align: center;

      box-shadow: 0 16px 45px rgba(0,0,0,0.10);

      backdrop-filter: blur(8px);

    }

    .icon {

      font-size: 36px;

      margin-bottom: 15px;

    }

    .category {

      font-size: 13px;

      letter-spacing: 2px;

      text-transform: uppercase;

      color: #68716b;

      margin-bottom: 18px;

    }

    .message {

      font-size: 28px;

      line-height: 1.35;

      font-weight: 600;

      margin: 0 auto 28px;

      max-width: 470px;

    }

    .care-box {

      display: none;

      padding: 20px;

      border-radius: 18px;

      margin-top: 10px;

      font-size: 17px;

      line-height: 1.5;

    }

    .care-title {

      font-weight: bold;

      margin-bottom: 8px;

    }

    .needed-button {

      margin-top: 28px;

      border: none;

      border-radius: 999px;

      padding: 14px 22px;

      font-size: 16px;

      cursor: pointer;

      background: #ffffff;

      box-shadow: 0 5px 16px rgba(0,0,0,0.08);

      transition: transform 0.2s ease;

    }

    .needed-button:hover {

      transform: translateY(-2px);

    }

    .response {

      min-height: 26px;

      margin-top: 15px;

      font-size: 16px;

      font-weight: 600;

    }

    .footer {

      margin-top: 26px;

      font-size: 13px;

      color: #747b76;

    }

    @media (max-width: 600px) {

      body {

        padding: 18px;

      }

      .card {

        padding: 36px 22px 26px;

      }

      .message {

        font-size: 25px;

      }

    }

  </style>

</head>

<body>

  <div class="page">

    <div class="card">

      <div class="icon" id="icon">🌿</div>

      <div class="category" id="category">

        Something you might need today

      </div>

      <div class="message" id="message"></div>

      <div class="care-box" id="careBox">

        <div class="care-title" id="careTitle"></div>

        <div id="careText"></div>

      </div>

      <button class="needed-button" id="neededButton">

        ❤️ I needed that today

      </button>

      <div class="response" id="response"></div>

      <div class="footer">

        Come back tomorrow. There'll be something different waiting for you.

      </div>

    </div>

  </div>

  <script>

    const messages = [

      {

        category: "In case nobody told you today",

        icon: "🌿",

        theme: "sage",

        affirmation: "You are appreciated more than you probably realise.",

        care: "Take the compliment without arguing with it. You deserve it."

      },

      {

        category: "Today's reminder",

        icon: "☀️",

        theme: "sun",

        affirmation: "You do not need to have everything figured out today.",

        care: "Relax your shoulders and focus only on the next thing in front of you."

      },

      {

        category: "A little perspective",

        icon: "💙",

        theme: "blue",

        affirmation: "A difficult moment does not have to become a difficult day.",

        care: "Take a drink of water, reset and start the next moment fresh."

      },

      {

        category: "For you today",

        icon: "🌸",

        theme: "peach",

        affirmation: "The work you do matters, even on the days nobody says it.",

        care: ""

      },

      {

        category: "60-second reset",

        icon: "🌱",

        theme: "sage",

        affirmation: "You are allowed to slow down without feeling guilty.",

        care: "Step away from your screen for one minute. Stretch, breathe and look away from the screen."

      },

      {

        category: "Today's encouragement",

        icon: "✨",

        theme: "lavender",

        affirmation: "Progress still counts when it feels small.",

        care: ""

      },

      {

        category: "A reminder worth keeping",

        icon: "💛",

        theme: "sun",

        affirmation: "You deserve the same kindness you give to everyone else.",

        care: "Talk to yourself today the way you would talk to someone you care about."

      },

      {

        category: "Take a moment",

        icon: "🌊",

        theme: "blue",

        affirmation: "You have made it through every difficult day so far.",

        care: "Take five slow breaths and give yourself a minute before moving on."

      },

      {

        category: "For you today",

        icon: "🌷",

        theme: "peach",

        affirmation: "You do not have to be productive every second to be valuable.",

        care: ""

      },

      {

        category: "Today's reminder",

        icon: "☀️",

        theme: "sun",

        affirmation: "Today does not need to be perfect to be good.",

        care: "Notice one small thing today that made you smile."

      },

      {

        category: "In case you forgot",

        icon: "💜",

        theme: "lavender",

        affirmation: "Your best can look different from one day to the next.",

        care: ""

      },

      {

        category: "Something worth remembering",

        icon: "🌿",

        theme: "sage",

        affirmation: "You make a difference simply by showing up.",

        care: "Take a moment to recognise how much you have already handled."

      },

      {

        category: "Today's permission slip",

        icon: "🌸",

        theme: "peach",

        affirmation: "It is okay to ask for help.",

        care: "If something feels heavy today, you do not have to carry all of it alone."

      },

      {

        category: "A little perspective",

        icon: "🌊",

        theme: "blue",

        affirmation: "You are more than your to-do list.",

        care: ""

      },

      {

        category: "Today's tiny reset",

        icon: "🌱",

        theme: "sage",

        affirmation: "One good moment can change the direction of your day.",

        care: "Make a coffee, stretch, step outside or play a song you love."

      },

      {

        category: "In case nobody told you today",

        icon: "💛",

        theme: "sun",

        affirmation: "You bring something to this team that nobody else can.",

        care: ""

      },

      {

        category: "A thought for today",

        icon: "✨",

        theme: "lavender",

        affirmation: "You don't need a perfect day. Just a better next moment.",

        care: "Choose one small thing that could make the next hour easier."

      },

      {

        category: "Today's encouragement",

        icon: "🌸",

        theme: "peach",

        affirmation: "You are doing better than you think.",

        care: ""

      },

      {

        category: "A reminder for busy days",

        icon: "🌿",

        theme: "sage",

        affirmation: "Your contribution is valuable even when it goes unnoticed.",

        care: "Pause for a moment and recognise one thing you have done well today."

      },

      {

        category: "Just for today",

        icon: "☀️",

        theme: "sun",

        affirmation: "You do not need to earn your rest.",

        care: "Give yourself five quiet minutes without feeling you need to justify them."

      }

    ];

    const themes = {

      sage: {

        background: "linear-gradient(135deg, #e7efe7, #cfded0)",

        care: "#edf5ed"

      },

      sun: {

        background: "linear-gradient(135deg, #fff5d6, #f8df9f)",

        care: "#fff8e6"

      },

      blue: {

        background: "linear-gradient(135deg, #e4f1f7, #cbdfe9)",

        care: "#edf7fb"

      },

      peach: {

        background: "linear-gradient(135deg, #fde8df, #f4c9ba)",

        care: "#fff0ea"

      },

      lavender: {

        background: "linear-gradient(135deg, #eee7f7, #d8c9ea)",

        care: "#f5effb"

      }

    };

    const today = new Date();

    const start = new Date(today.getFullYear(), 0, 0);

    const difference = today - start;

    const dayOfYear = Math.floor(difference / 86400000);

    const item = messages[(dayOfYear - 1) % messages.length];

    const theme = themes[item.theme];

    document.body.style.background = theme.background;

    document.getElementById("icon").textContent = item.icon;

    document.getElementById("category").textContent = item.category;

    document.getElementById("message").textContent = item.affirmation;

    const careBox = document.getElementById("careBox");

    if (item.care && item.care.trim() !== "") {

      careBox.style.display = "block";

      careBox.style.background = theme.care;

      document.getElementById("careTitle").textContent = "A little moment for you";

      document.getElementById("careText").textContent = item.care;

    }

    const neededButton = document.getElementById("neededButton");

    const response = document.getElementById("response");

    neededButton.addEventListener("click", function () {

      response.textContent = "Then this one was meant for you. ❤️";

      neededButton.textContent = "❤️ Keep this one with you";

    });

  </script>

</body>

</html>
